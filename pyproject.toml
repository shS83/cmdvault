[project]
name = "cmdvault"
version = "0.2.0"
description = "Find and keep useful commands from Bash history"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=47.0.0",
    "httpx>=0.28.1",
    "pillow>=11.3.0",
    "platformdirs>=4.4.0",
    "pytest>=8.4.2",
]

[project.optional-dependencies]
graphics = ["pillow>=10.4.0"]
