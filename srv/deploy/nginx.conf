# Include in nginx http context. Provision the certificate before enabling.
limit_req_zone $binary_remote_addr zone=cmdvault_login:10m rate=2r/m;
# Deliberately omit query strings, credentials, request bodies and referrers.
log_format cmdvault_safe '$remote_addr $request_method $uri $status $request_time';
server {
    listen 80;
    server_name sync.prometheus-alexander.fi;
    return 308 https://sync.prometheus-alexander.fi$request_uri;
}
server {
    listen 443 ssl;
    server_name sync.prometheus-alexander.fi;
    ssl_certificate /etc/letsencrypt/live/sync.prometheus-alexander.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.prometheus-alexander.fi/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log /var/log/nginx/cmdvault-access.log cmdvault_safe;
    error_log /var/log/nginx/cmdvault-error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /api/v1/auth/login {
        limit_req zone=cmdvault_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8017;
        include /etc/nginx/snippets/cmdvault-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:8017;
        include /etc/nginx/snippets/cmdvault-proxy.conf;
    }
}
